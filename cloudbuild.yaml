# Build and deploy to Cloud Run (Neon serverless Postgres via DATABASE_URL).
# Prerequisites:
#   - Artifact Registry repo: cloud-run-source-deploy (in the deploy region)
#   - Secret Manager secrets: DATABASE_URL, DB_SCHEMA
#
# Usage (us-east4 is closest GCP region to Neon aws-us-east-1):
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_SERVICE_NAME=lorebot-graphql-api,_REGION=us-east4

substitutions:
  _SERVICE_NAME: lorebot-graphql-api
  _REGION: us-east4
  _TAG: latest

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE_NAME}:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE_NAME}:$BUILD_ID
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE_NAME}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE_NAME}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --cpu=1
      - --memory=512Mi
      - --concurrency=80
      - --min-instances=0
      - --max-instances=10
      - --timeout=300
      - --allow-unauthenticated
      - --set-env-vars=NODE_ENV=production,HOST=0.0.0.0
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,DB_SCHEMA=DB_SCHEMA:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE_NAME}:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE_NAME}:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
