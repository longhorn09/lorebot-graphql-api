# Build and deploy to Cloud Run (Neon serverless Postgres via DATABASE_URL).
# Prerequisites:
#   - Artifact Registry repo: cloud-run-source-deploy
#   - Secret Manager secret for DATABASE_URL (recommended)
#
# Usage:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_SERVICE_NAME=lorebot-graphql-api,_REGION=us-east1

substitutions:
  _SERVICE_NAME: lorebot-graphql-api
  _REGION: us-east1

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE_NAME}:$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE_NAME}:$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE_NAME}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --port=8080
      - --cpu=1
      - --memory=512Mi
      - --concurrency=80
      - --min-instances=0
      - --max-instances=10
      - --timeout=300
      - --allow-unauthenticated
      - --set-env-vars=NODE_ENV=production,HOST=0.0.0.0,DB_SCHEMA=lorebot
      # Attach DATABASE_URL from Secret Manager after first deploy, e.g.:
      # --set-secrets=DATABASE_URL=DATABASE_URL:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE_NAME}:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
